<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Agent Skyline daylight climates</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1400px; height: 900px; overflow: hidden; }
    body { padding: 28px; background: #edf2f7; color: #24303d; font-family: "Segoe UI", system-ui, sans-serif; }
    header { display: flex; height: 62px; align-items: flex-start; justify-content: space-between; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
    p { margin: 7px 0 0; color: #66717d; font-size: 13px; }
    .note { color: #246bce; font-size: 12px; font-weight: 650; }
    .grid { display: grid; height: 774px; grid-template-columns: 1fr 1fr; gap: 16px; }
    figure { position: relative; margin: 0; overflow: hidden; border: 1px solid #d8dde2; border-radius: 14px; background: #fffefa; box-shadow: 0 10px 28px rgb(36 48 61 / 8%); }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }
    figcaption { position: absolute; top: 12px; left: 12px; padding: 6px 9px; border: 1px solid rgb(36 48 61 / 12%); border-radius: 7px; background: rgb(255 254 250 / 92%); color: #24303d; font-size: 11px; font-weight: 700; }
  </style>
</head>
<body>
  <header><div><h1>Four daylight city climates</h1><p>Persistent theme IDs stay compatible; every visible palette remains bright.</p></div><div class="note">Blueprint · Garden · Terracotta · Paper</div></header>
  <main class="grid">
    <figure><img src="../../.tmp/theme-frames/midnight.svg" alt="Blueprint climate"><figcaption>Blueprint</figcaption></figure>
    <figure><img src="../../.tmp/theme-frames/aurora.svg" alt="Garden climate"><figcaption>Garden</figcaption></figure>
    <figure><img src="../../.tmp/theme-frames/sunset.svg" alt="Terracotta climate"><figcaption>Terracotta</figcaption></figure>
    <figure><img src="../../.tmp/theme-frames/paper.svg" alt="Paper climate"><figcaption>Paper</figcaption></figure>
  </main>
</body>
</html>
