name: Feature request
description: Propose a visual, privacy, compatibility, or sharing improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Does it require new retained data?
      options:
        - No
        - Yes, coarse local-only data
        - Yes, raw content or remote services
        - Unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
