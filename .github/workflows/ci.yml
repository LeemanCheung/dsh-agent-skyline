name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate source
        run: npm run check
      - name: Verify deterministic generated artifacts
        run: npm run determinism
      - name: Verify committed generated artifacts
        shell: bash
        run: |
          git diff --exit-code HEAD -- lib demo/core.js docs/preview.svg docs/architecture.svg
          git diff --cached --exit-code HEAD -- lib demo/core.js docs/preview.svg docs/architecture.svg
          test -z "$(git ls-files --others -- lib demo/core.js docs/preview.svg docs/architecture.svg)"
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Build tracked-source snapshot
        if: github.event_name != 'pull_request'
        shell: bash
        run: git archive --format=zip --output=/tmp/dsh-agent-skyline-source.zip HEAD
      - name: Upload tracked-source snapshot
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-agent-skyline-source-${{ github.sha }}
          path: /tmp/dsh-agent-skyline-source.zip
          if-no-files-found: error
          retention-days: 1
