name: Bootstrap and publish Agent Skyline

on:
  push:
    branches: [main]
    paths:
      - '_bootstrap/**'
      - '.github/workflows/bootstrap-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-skyline-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.repository == 'LeemanCheung/dsh-agent-skyline'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            _bootstrap/skyline-text.tar.gz.b64.part-00 \
            _bootstrap/skyline-text.tar.gz.b64.part-01 \
            _bootstrap/skyline-text.tar.gz.b64.part-02 \
            _bootstrap/skyline-text.tar.gz.b64.part-03 \
            _bootstrap/skyline-text.tar.gz.b64.part-04 \
            _bootstrap/skyline-text.tar.gz.b64.part-05 \
            _bootstrap/skyline-text.tar.gz.b64.part-06 \
            _bootstrap/skyline-text.tar.gz.b64.part-07-0 \
            _bootstrap/skyline-text.tar.gz.b64.part-07-1 \
            _bootstrap/skyline-text.tar.gz.b64.part-07-2 \
            _bootstrap/skyline-text.tar.gz.b64.part-07-3 \
            _bootstrap/skyline-text.tar.gz.b64.part-08 \
            > /tmp/skyline-text.tar.gz.b64
          echo '59528f3f73bb71caa342948aa8a4a521078b465ab0fb25b5d68415575be4d573  /tmp/skyline-text.tar.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/skyline-text.tar.gz.b64 > /tmp/skyline-text.tar.gz
          echo '73ee76db5630014dfd5b5d95c8b7355ac0222af28d3ece0c321488a91fcae237  /tmp/skyline-text.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/skyline-text.tar.gz --directory .
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap-release.yml
          test -f package.json
          test -f src/core.js
          test -f demo/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate plugin source
        run: npm run check

      - name: Install deterministic render tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-bin imagemagick
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Render release assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/render-themes.mjs
          node scripts/render-animation.mjs
          rsvg-convert --width 1200 --height 720 docs/preview.svg --output docs/preview.png

          mkdir -p /tmp/skyline-themes
          for theme in midnight aurora sunset paper; do
            rsvg-convert --width 600 --height 360 ".tmp/theme-frames/${theme}.svg" --output "/tmp/skyline-themes/${theme}.png"
          done
          montage /tmp/skyline-themes/midnight.png /tmp/skyline-themes/aurora.png \
            /tmp/skyline-themes/sunset.png /tmp/skyline-themes/paper.png \
            -tile 2x2 -geometry +0+0 docs/themes.png

          mkdir -p /tmp/skyline-construction
          for frame in .tmp/construction-frames/*.svg; do
            target="/tmp/skyline-construction/$(basename "${frame%.svg}").png"
            rsvg-convert --width 640 --height 384 "$frame" --output "$target"
          done
          convert -delay 12 -loop 0 /tmp/skyline-construction/*.png docs/construction.gif

          python3 -m http.server 4173 --directory demo >/tmp/agent-skyline-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ >/dev/null

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          try {
            const desktop = await browser.newPage({ viewport: { width: 1500, height: 950 } })
            await desktop.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
            await desktop.screenshot({ path: 'docs/ui-preview.png' })
            const mobile = await browser.newPage({ viewport: { width: 390, height: 1238 }, isMobile: true })
            await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
            await mobile.screenshot({ path: 'docs/mobile-preview.png' })
          } finally {
            await browser.close()
          }
          NODE

          convert docs/preview.png -resize '1280x640^' -gravity center -extent 1280x640 docs/social-preview.png
          identify docs/preview.png docs/ui-preview.png docs/mobile-preview.png docs/social-preview.png docs/themes.png docs/construction.gif
          test "$(identify -format '%wx%h' docs/preview.png)" = '1200x720'
          test "$(identify -format '%wx%h' docs/ui-preview.png)" = '1500x950'
          test "$(identify -format '%wx%h' docs/mobile-preview.png)" = '390x1238'
          test "$(identify -format '%wx%h' docs/social-preview.png)" = '1280x640'

      - name: Verify package and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm pack --dry-run
          test ! -e _bootstrap
          test ! -e .github/workflows/bootstrap-release.yml

      - name: Commit and push complete plugin
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: launch privacy-first Agent Skyline plugin'
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          git tag --force --annotate v1.0.0 --message 'Agent Skyline v1.0.0' "$final_sha"
          git push --force origin refs/tags/v1.0.0

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          git archive --format=zip --output=dist/dsh-agent-skyline-v1.0.0.zip HEAD
          cp docs/social-preview.png dist/agent-skyline-social-preview.png
          cp docs/construction.gif dist/agent-skyline-construction.gif
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v1.0.0 --yes 2>/dev/null || true
          gh release create v1.0.0 \
            dist/dsh-agent-skyline-1.0.0.tgz \
            dist/dsh-agent-skyline-v1.0.0.zip \
            dist/agent-skyline-social-preview.png \
            dist/agent-skyline-construction.gif \
            dist/SHA256SUMS.txt \
            --target "$FINAL_SHA" \
            --title 'Agent Skyline v1.0.0' \
            --notes-file docs/release-notes-v1.0.0.md
