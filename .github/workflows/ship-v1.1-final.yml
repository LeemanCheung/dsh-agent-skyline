name: Final Agent Skyline v1.1 integration and release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ship-v1.1-final.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: agent-skyline-v1-1-final-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'LeemanCheung/dsh-agent-skyline'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final deterministic v1.1 source transformations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-v11-sidecar.mjs
          node scripts/finalize-v11-fixed.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const file = JSON.parse(await readFile('package.json', 'utf8'))
          file.scripts.check = file.scripts.check.replace(' && node --check src/v11-sidecar.js', '')
          await writeFile('package.json', `${JSON.stringify(file, null, 2)}\n`)
          NODE

      - name: Run complete dependency-free validation
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm pack --dry-run
          test "$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")" = '1.1.0'

      - name: Install deterministic visual test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Exercise real desktop and mobile browser interactions
        shell: bash
        run: |
          set -euo pipefail
          npm run demo
          python3 -m http.server 4173 --directory demo >/tmp/agent-skyline-v11-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ >/dev/null
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          try {
            const desktop = await browser.newPage({ viewport: { width: 1500, height: 950 }, deviceScaleFactor: 1 })
            await desktop.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
            await desktop.waitForSelector('.sky-v11', { timeout: 10_000 })
            await desktop.screenshot({ path: 'docs/v11-preview.png', fullPage: true })

            const desktopResult = await desktop.evaluate(async () => {
              window.dispatchEvent(new CustomEvent('dsh-task-dag:snapshot', {
                detail: { nodes: 18, edges: 27, workflows: 4, agents: 6, completed: 15, failed: 1, privateTask: 'must-not-export' },
              }))
              window.dispatchEvent(new CustomEvent('dsh-token-usage:snapshot', {
                detail: { inputTokens: 142000, outputTokens: 33000, cachedTokens: 22000, requests: 41, apiKey: 'must-not-export' },
              }))
              window.AgentSkylineV11.refresh()
              await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)))
              const snapshot = window.AgentSkylineV11.readEcosystem()
              const seed = window.AgentSkylineV11.createCitySeed({ cityId: 'browser-check', metrics: { totalEvents: 38 }, ecosystem: snapshot })
              const parsed = window.AgentSkylineV11.parseCitySeed(seed)
              return {
                version: window.AgentSkylineV11.version,
                privacy: window.AgentSkylineV11.privacy,
                actions: [...document.querySelectorAll('.sky-v11-action')].map(node => node.textContent),
                sections: document.querySelectorAll('.sky-v11').length,
                snapshot,
                parsed,
                leak: seed.includes('must-not-export'),
              }
            })
            console.log(JSON.stringify(desktopResult))
            if (desktopResult.version !== '1.1.0' || desktopResult.privacy !== 'aggregate-only') throw new Error('v1.1 browser API mismatch')
            if (desktopResult.sections !== 1 || desktopResult.actions.length !== 4) throw new Error('v1.1 controls were mounted more than once or incompletely')
            if (desktopResult.snapshot.taskDag.nodes !== 18 || desktopResult.snapshot.tokenUsage.totalTokens !== 197000) throw new Error('local ecosystem aggregate bridge mismatch')
            if (desktopResult.parsed.cityId !== 'browser-check' || desktopResult.leak) throw new Error('city seed privacy or round-trip mismatch')

            const mobile = await browser.newPage({ viewport: { width: 390, height: 1238 }, deviceScaleFactor: 1, isMobile: true })
            await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
            await mobile.waitForSelector('.sky-v11', { timeout: 10_000 })
            const mobileLayout = await mobile.evaluate(() => {
              const section = document.querySelector('.sky-v11')
              const actions = document.querySelector('.sky-v11-actions')
              return {
                sectionWidth: Math.round(section.getBoundingClientRect().width),
                columns: getComputedStyle(actions).gridTemplateColumns,
                actionCount: actions.children.length,
              }
            })
            console.log(JSON.stringify(mobileLayout))
            if (mobileLayout.sectionWidth > 390 || mobileLayout.actionCount !== 4) throw new Error('mobile v1.1 layout overflow or missing controls')
            await mobile.screenshot({ path: 'docs/v11-mobile-preview.png', fullPage: true })
          } finally {
            await browser.close()
          }
          NODE
          test -s docs/v11-preview.png
          test -s docs/v11-mobile-preview.png

      - name: Rebuild and revalidate after browser rendering
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm pack --dry-run
          node scripts/v11-smoke.mjs

      - name: Commit integrated v1.1 source and visual assets
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: launch Agent Skyline v1.1 local ecosystem'
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "final_sha=$final_sha"

      - name: Build complete v1.1 release payload
        shell: bash
        run: |
          set -euo pipefail
          final_sha='${{ steps.publish.outputs.sha }}'
          rm -rf dist
          mkdir -p dist
          npm pack --pack-destination dist
          git archive --format=zip --output=dist/dsh-agent-skyline-v1.1.0.zip "$final_sha"
          cp docs/social-preview.png dist/agent-skyline-social-preview.png
          cp docs/construction.gif dist/agent-skyline-construction.gif
          cp docs/v11-preview.png dist/agent-skyline-v1.1-preview.png
          cp docs/v11-mobile-preview.png dist/agent-skyline-v1.1-mobile-preview.png
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh release delete v1.1.0 --yes 2>/dev/null || true
          git tag --delete v1.1.0 2>/dev/null || true
          git tag --force --annotate v1.1.0 --message 'Agent Skyline v1.1.0' "$FINAL_SHA"
          git push --force origin refs/tags/v1.1.0
          gh release create v1.1.0 \
            dist/dsh-agent-skyline-1.1.0.tgz \
            dist/dsh-agent-skyline-v1.1.0.zip \
            dist/agent-skyline-social-preview.png \
            dist/agent-skyline-construction.gif \
            dist/agent-skyline-v1.1-preview.png \
            dist/agent-skyline-v1.1-mobile-preview.png \
            dist/SHA256SUMS.txt \
            --target "$FINAL_SHA" \
            --title 'Agent Skyline v1.1.0' \
            --notes-file docs/release-notes-v1.1.0.md

      - name: Trigger independent main CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run ci.yml --ref main || true
