name: Publish Agent Skyline release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag (must match package.json)
        required: false
        default: v1.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: agent-skyline-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'LeemanCheung/dsh-agent-skyline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and package
        run: npm run check
      - name: Build release files
        id: files
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_TAG}"
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          expected_tag="v${version}"
          if [ "$tag" != "$expected_tag" ]; then
            echo "Release tag $tag does not match package version $version ($expected_tag)." >&2
            exit 1
          fi
          mkdir -p dist
          npm pack --pack-destination dist
          zip="dist/dsh-agent-skyline-${tag}.zip"
          git archive --format=zip --output="$zip" "$GITHUB_SHA"
          cp docs/social-preview.png dist/agent-skyline-social-preview.png
          cp docs/construction.gif dist/agent-skyline-construction.gif
          test -s "dist/dsh-agent-skyline-${version}.tgz"
          test -s "$zip"
          test -s dist/agent-skyline-social-preview.png
          test -s dist/agent-skyline-construction.gif
          (cd dist && sha256sum * > SHA256SUMS.txt)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          cat dist/SHA256SUMS.txt
      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.files.outputs.tag }}
          VERSION: ${{ steps.files.outputs.version }}
          ZIP_FILE: ${{ steps.files.outputs.zip }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            git tag --delete "$TAG" 2>/dev/null || true
            git tag --annotate "$TAG" --message "Agent Skyline ${TAG}" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
          else
            git rev-parse --verify "refs/tags/$TAG" >/dev/null
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; refusing to overwrite it on a tag push." >&2
              exit 1
            fi
          fi

          notes=(--generate-notes)
          notes_file="docs/release-notes-${TAG}.md"
          if [ -f "$notes_file" ]; then
            notes=(--notes-file "$notes_file")
          fi

          gh release create "$TAG" \
            "dist/dsh-agent-skyline-${VERSION}.tgz" \
            "$ZIP_FILE" \
            dist/agent-skyline-social-preview.png \
            dist/agent-skyline-construction.gif \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Agent Skyline ${TAG}" \
            "${notes[@]}"
