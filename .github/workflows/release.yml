name: Publish Agent Skyline release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (must match package.json)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: agent-skyline-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'LeemanCheung/dsh-agent-skyline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and package
        run: npm run check
      - name: Build release files
        id: files
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_TAG}"
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          expected_tag="v${version}"
          if [ "$tag" != "$expected_tag" ]; then
            echo "Release tag $tag does not match package version $version ($expected_tag)." >&2
            exit 1
          fi
          release_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          if [ "$tag_sha" != "$release_sha" ]; then
            echo "Checked-out commit $release_sha does not match immutable tag $tag ($tag_sha)." >&2
            exit 1
          fi
          mkdir -p dist
          npm pack --pack-destination dist
          zip="dist/dsh-agent-skyline-${tag}.zip"
          git archive --format=zip --output="$zip" "$release_sha"
          cp docs/social-preview.png dist/agent-skyline-social-preview.png
          cp docs/construction.gif dist/agent-skyline-construction.gif
          test -s "dist/dsh-agent-skyline-${version}.tgz"
          test -s "$zip"
          test -s dist/agent-skyline-social-preview.png
          test -s dist/agent-skyline-construction.gif
          (cd dist && sha256sum * > SHA256SUMS.txt)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          cat dist/SHA256SUMS.txt
      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.files.outputs.tag }}
          VERSION: ${{ steps.files.outputs.version }}
          ZIP_FILE: ${{ steps.files.outputs.zip }}
          RELEASE_SHA: ${{ steps.files.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "Tag $TAG moved from validated commit $RELEASE_SHA to $tag_sha; refusing publication." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          notes=(--generate-notes)
          notes_file="docs/release-notes-${TAG}.md"
          if [ -f "$notes_file" ]; then
            notes=(--notes-file "$notes_file")
          fi

          gh release create "$TAG" \
            "dist/dsh-agent-skyline-${VERSION}.tgz" \
            "$ZIP_FILE" \
            dist/agent-skyline-social-preview.png \
            dist/agent-skyline-construction.gif \
            dist/SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title "Agent Skyline ${TAG}" \
            "${notes[@]}"
