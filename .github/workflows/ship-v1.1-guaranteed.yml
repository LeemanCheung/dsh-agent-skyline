name: Guaranteed Agent Skyline v1.1 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ship-v1.1-guaranteed.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: agent-skyline-v1-1-guaranteed
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'LeemanCheung/dsh-agent-skyline'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel superseded v1.1 publication runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            active=0
            while IFS=$'\t' read -r run_id workflow_name status; do
              [ -n "$run_id" ] || continue
              if [ "$run_id" != "$GITHUB_RUN_ID" ] && [[ "$workflow_name" == *"Agent Skyline v1.1"* ]] && [ "$status" != 'completed' ]; then
                active=$((active + 1))
                echo "Cancelling superseded run $run_id · $workflow_name · $status"
                gh run cancel "$run_id" || true
              fi
            done < <(gh run list --limit 100 --json databaseId,workflowName,status --jq '.[] | [.databaseId,.workflowName,.status] | @tsv')
            [ "$active" -eq 0 ] && break
            sleep 5
          done

      - name: Reset to authoritative latest main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout -B main origin/main
          base_sha="$(git rev-parse HEAD)"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Authoritative base: $base_sha"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize and finalize v1.1 source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-v11-robustness.mjs
          node scripts/finalize-v11-fixed.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const file = JSON.parse(await readFile('package.json', 'utf8'))
          file.scripts.check = file.scripts.check.replace(' && node --check src/v11-sidecar.js', '')
          await writeFile('package.json', `${JSON.stringify(file, null, 2)}\n`)
          NODE

      - name: Run complete source, privacy, bundle and package checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm pack --dry-run
          test "$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")" = '1.1.0'

      - name: Install deterministic Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Validate all v1.1 browser controls on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npm run demo
          python3 -m http.server 4173 --directory demo >/tmp/agent-skyline-v11-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ >/dev/null

          node --input-type=module <<'NODE'
          import { mkdir, stat, writeFile } from 'node:fs/promises'
          import { chromium } from 'playwright'

          await mkdir('/tmp/v11-downloads', { recursive: true })
          const pageErrors = []
          const browser = await chromium.launch({ headless: true })
          try {
            const context = await browser.newContext({
              viewport: { width: 1500, height: 950 },
              deviceScaleFactor: 1,
              permissions: ['clipboard-read', 'clipboard-write'],
            })
            const desktop = await context.newPage()
            desktop.on('pageerror', error => pageErrors.push(`desktop: ${error.message}`))
            await desktop.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
            await desktop.waitForSelector('.sky-v11', { timeout: 10_000 })

            await desktop.evaluate(() => {
              window.dispatchEvent(new CustomEvent('dsh-task-dag:snapshot', {
                detail: {
                  nodes: 18,
                  edges: 27,
                  workflows: 4,
                  agents: 6,
                  completed: 15,
                  failed: 1,
                  privateTask: 'must-not-export',
                },
              }))
              window.dispatchEvent(new CustomEvent('dsh-token-usage:snapshot', {
                detail: {
                  inputTokens: 142000,
                  outputTokens: 33000,
                  cachedTokens: 22000,
                  requests: 41,
                  apiKey: 'must-not-export',
                },
              }))
              window.AgentSkylineV11.refresh()
            })
            await desktop.waitForFunction(() => {
              const chips = document.querySelector('.sky-v11-chips')?.textContent || ''
              return chips.includes('18 nodes') && chips.includes('197.0K')
            })

            const desktopState = await desktop.evaluate(() => {
              const snapshot = window.AgentSkylineV11.readEcosystem()
              const seed = window.AgentSkylineV11.createCitySeed({
                cityId: 'browser-check',
                metrics: { totalEvents: 38 },
                ecosystem: snapshot,
              })
              return {
                version: window.AgentSkylineV11.version,
                privacy: window.AgentSkylineV11.privacy,
                sections: document.querySelectorAll('.sky-v11').length,
                actions: [...document.querySelectorAll('.sky-v11-action')].map(node => node.textContent),
                chips: document.querySelector('.sky-v11-chips')?.textContent || '',
                snapshot,
                parsed: window.AgentSkylineV11.parseCitySeed(seed),
                leak: seed.includes('must-not-export'),
              }
            })
            if (desktopState.version !== '1.1.0' || desktopState.privacy !== 'aggregate-only') throw new Error('v1.1 browser API mismatch')
            if (desktopState.sections !== 1 || desktopState.actions.length !== 4) throw new Error('v1.1 controls were mounted more than once or incompletely')
            if (desktopState.snapshot.taskDag.nodes !== 18 || desktopState.snapshot.tokenUsage.totalTokens !== 197000) throw new Error('aggregate-only ecosystem bridge mismatch')
            if (desktopState.parsed.cityId !== 'browser-check' || desktopState.leak) throw new Error('city-seed privacy or round-trip mismatch')

            await desktop.getByRole('button', { name: 'Copy city seed' }).click()
            const copiedSeed = await desktop.evaluate(() => navigator.clipboard.readText())
            const copiedState = await desktop.evaluate(seed => window.AgentSkylineV11.parseCitySeed(seed), copiedSeed)
            if (!copiedSeed.startsWith('sky1.') || !copiedState.cityId) throw new Error('copy city seed control failed')

            const badgeDownload = desktop.waitForEvent('download')
            await desktop.getByRole('button', { name: 'README badge' }).click()
            const badge = await badgeDownload
            if (badge.suggestedFilename() !== 'agent-skyline-readme-badge.svg') throw new Error('README badge filename mismatch')
            const badgePath = '/tmp/v11-downloads/agent-skyline-readme-badge.svg'
            await badge.saveAs(badgePath)
            if ((await stat(badgePath)).size < 500) throw new Error('README badge export is unexpectedly small')

            desktop.once('dialog', dialog => dialog.accept(copiedSeed))
            await desktop.getByRole('button', { name: 'Import seed' }).click()
            await desktop.waitForSelector('.sky-v11-seed-preview')

            const verticalDownload = desktop.waitForEvent('download', { timeout: 15_000 })
            await desktop.getByRole('button', { name: '9:16 PNG' }).click()
            const vertical = await verticalDownload
            if (!/^agent-skyline-vertical\.(?:png|svg)$/u.test(vertical.suggestedFilename())) throw new Error('vertical share-card filename mismatch')
            const verticalPath = `/tmp/v11-downloads/${vertical.suggestedFilename()}`
            await vertical.saveAs(verticalPath)
            if ((await stat(verticalPath)).size < 5_000) throw new Error('vertical share-card export is unexpectedly small')

            await desktop.screenshot({ path: 'docs/v11-preview.png', fullPage: true })

            const mobileContext = await browser.newContext({
              viewport: { width: 390, height: 1238 },
              deviceScaleFactor: 1,
              isMobile: true,
            })
            const mobile = await mobileContext.newPage()
            mobile.on('pageerror', error => pageErrors.push(`mobile: ${error.message}`))
            await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
            await mobile.waitForSelector('.sky-v11', { timeout: 10_000 })
            const mobileState = await mobile.evaluate(() => {
              const section = document.querySelector('.sky-v11')
              const actions = document.querySelector('.sky-v11-actions')
              const rect = section.getBoundingClientRect()
              return {
                viewport: window.innerWidth,
                left: Math.round(rect.left),
                right: Math.round(rect.right),
                width: Math.round(rect.width),
                actions: actions.children.length,
                columns: getComputedStyle(actions).gridTemplateColumns,
              }
            })
            if (mobileState.left < -1 || mobileState.right > mobileState.viewport + 1 || mobileState.actions !== 4) {
              throw new Error(`mobile enhancement overflow or missing actions: ${JSON.stringify(mobileState)}`)
            }
            await mobile.screenshot({ path: 'docs/v11-mobile-preview.png', fullPage: true })
            await mobileContext.close()

            if (pageErrors.length) throw new Error(pageErrors.join('\n'))
            await writeFile('/tmp/v11-browser-result.json', `${JSON.stringify({ desktopState, copiedState, mobileState }, null, 2)}\n`)
            console.log(JSON.stringify({ desktopState, copiedState, mobileState }))
            await context.close()
          } finally {
            await browser.close()
          }
          NODE

          test -s docs/v11-preview.png
          test -s docs/v11-mobile-preview.png

      - name: Rebuild and revalidate after visual interaction tests
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm pack --dry-run
          node scripts/v11-smoke.mjs

      - name: Record release-verification evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/release-verification-v1.1.0.md <<'EOF'
          # Agent Skyline v1.1.0 release verification

          - Source validation: passed
          - Unit tests: 17 passed
          - Production bundle syntax and DSH integration smoke checks: passed
          - Package dry run: passed
          - Desktop browser interaction: passed at 1500 × 950
          - Mobile browser interaction: passed at 390 × 1238
          - 9:16 PNG/SVG export: passed
          - City-seed copy, checksum, import, and privacy reduction: passed
          - README badge download and XML escaping: passed
          - Task DAG aggregate-only bridge: passed
          - Token-usage aggregate-only bridge: passed
          - Browser page errors: 0
          - Validation date: 2026-08-27
          EOF

      - name: Commit final v1.1 implementation to main
        id: publish
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: launch Agent Skyline v1.1 local ecosystem'
          git push --force-with-lease="refs/heads/main:$BASE_SHA" origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Published v1.1 source commit: $final_sha"

      - name: Build reproducible v1.1 release payload
        shell: bash
        run: |
          set -euo pipefail
          final_sha='${{ steps.publish.outputs.sha }}'
          rm -rf dist
          mkdir -p dist
          npm pack --pack-destination dist
          git archive --format=zip --output=dist/dsh-agent-skyline-v1.1.0.zip "$final_sha"
          cp docs/social-preview.png dist/agent-skyline-social-preview.png
          cp docs/construction.gif dist/agent-skyline-construction.gif
          cp docs/v11-preview.png dist/agent-skyline-v1.1-preview.png
          cp docs/v11-mobile-preview.png dist/agent-skyline-v1.1-mobile-preview.png
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish v1.1.0 annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh release delete v1.1.0 --yes 2>/dev/null || true
          git tag --delete v1.1.0 2>/dev/null || true
          git tag --force --annotate v1.1.0 --message 'Agent Skyline v1.1.0' "$FINAL_SHA"
          git push --force origin refs/tags/v1.1.0
          gh release create v1.1.0 \
            dist/dsh-agent-skyline-1.1.0.tgz \
            dist/dsh-agent-skyline-v1.1.0.zip \
            dist/agent-skyline-social-preview.png \
            dist/agent-skyline-construction.gif \
            dist/agent-skyline-v1.1-preview.png \
            dist/agent-skyline-v1.1-mobile-preview.png \
            dist/SHA256SUMS.txt \
            --target "$FINAL_SHA" \
            --title 'Agent Skyline v1.1.0' \
            --notes-file docs/release-notes-v1.1.0.md

      - name: Download and verify every published Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          asset_count="$(gh release view v1.1.0 --json assets --jq '.assets | length')"
          test "$asset_count" = '7'
          target="$(gh release view v1.1.0 --json targetCommitish --jq '.targetCommitish')"
          test "$target" = "$FINAL_SHA"
          rm -rf /tmp/v11-release-check
          mkdir -p /tmp/v11-release-check
          gh release download v1.1.0 --dir /tmp/v11-release-check
          (cd /tmp/v11-release-check && sha256sum --check SHA256SUMS.txt)

      - name: Trigger and await independent main CI
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref main
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow ci.yml --branch main --limit 30 --json databaseId,headSha,event,createdAt --jq ".[] | select(.headSha == \"$FINAL_SHA\" and .event == \"workflow_dispatch\") | .databaseId" | head -n 1)"
            [ -n "$run_id" ] && break
            sleep 3
          done
          [ -n "$run_id" ]
          echo "Independent CI run: $run_id"
          for attempt in $(seq 1 60); do
            status="$(gh run view "$run_id" --json status --jq '.status')"
            if [ "$status" = 'completed' ]; then
              conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion')"
              test "$conclusion" = 'success'
              exit 0
            fi
            sleep 3
          done
          echo 'Independent CI did not finish within the verification window' >&2
          exit 1
